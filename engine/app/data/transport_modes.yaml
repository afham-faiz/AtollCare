# DEMO ASSUMPTION — illustrative transport parameters, not operator data. (F-M2.5)
detour_factor:
  sea: 1.25
  air: 1.05
  ground: 1.0

daylight:
  sunrise: "06:00"
  sunset: "18:15"
  seaplane_return_buffer_min: 60   # seaplane must land by sunset − buffer so it can fly home

modes:
  - mode: ground
    label: Ground ambulance
    speed_kmh: 30
    dispatch_min: 5
    handover_min: 5
    medic_onboard: false
    requires_asset: false
    constraints: "Same island only, or linked islands (bridge / causeway)"
  - mode: speedboat
    label: Speedboat
    speed_kmh: 45
    dispatch_min: 15
    handover_min: 10
    medic_onboard: false
    requires_asset: true
    disabled_sea_state_gte: 5
    slow_sea_state: 4
    slow_factor: 0.8
    constraints: "Any island ↔ island; disabled if sea state ≥ 5; ×0.8 speed at sea state 4"
  - mode: sea_ambulance
    label: Sea ambulance
    speed_kmh: 37
    dispatch_min: 25
    handover_min: 10
    medic_onboard: true
    requires_asset: true
    disabled_sea_state_gte: 6
    constraints: "Any island ↔ island; disabled if sea state ≥ 6; medic onboard"
  - mode: seaplane
    label: Seaplane
    speed_kmh: 280
    dispatch_min: 45
    handover_min: 15
    medic_onboard: false
    requires_asset: true
    daylight_only: true
    max_wind_kt: 25
    min_visibility_km: 5
    constraints: "Lands at any lagoon; daylight only; disabled if wind ≥ 25 kt or visibility < 5 km"
  - mode: fixed_wing
    label: Fixed-wing medevac
    speed_kmh: 450
    dispatch_min: 60
    handover_min: 20
    medic_onboard: true
    requires_asset: true
    airport_only: true
    min_visibility_km: 2
    constraints: "Airport ↔ airport only; night allowed; disabled if visibility < 2 km"
  - mode: helicopter
    label: Helicopter
    speed_kmh: 220
    dispatch_min: 30
    handover_min: 10
    medic_onboard: true
    requires_asset: true
    enabled: false   # toggle in /demo
    min_visibility_km: 3
    constraints: "Disabled by default (no medevac helicopter assumed); toggle in /demo"

# Pairs reachable by road (bridge / causeway). effective_speed_kmh overrides the ground speed.
ground_links:
  - {a: hulhule, b: igmh, effective_speed_kmh: 15, note: "Sinamalé bridge"}
  - {a: gan_l_rh, b: kadhdhoo, effective_speed_kmh: 30, note: "Laamu link road"}
