# DEMO ASSUMPTION — illustrative clinical reference values; not medical advice. (F-M2.4)
# window_from: onset (symptom onset / injury / recognition) | first_medical_contact (case created_at)
# preferred_capabilities: {capability: bonus_min} — score bonus for a destination with it, only within window
# interim: plan used when no route reaches definitive care inside the window.
#   window_min — time from window start to reaching the interim facility
#   allow_origin — the origin health centre itself can deliver the interim treatment
conditions:
  - id: stemi
    label: Heart attack (STEMI)
    window_min: 120
    window_from: first_medical_contact
    window_label: "to PCI (cath lab)"
    time_critical: true
    required_capabilities: [cath_lab]
    interim:
      label: Fibrinolysis
      capabilities: [thrombolysis]
      window_min: 180
      stabilise_min: 30
      allow_origin: false
  - id: stroke
    label: Stroke
    window_min: 270
    window_from: onset
    window_label: "to thrombolysis"
    time_critical: true
    required_capabilities: [ct, thrombolysis]
    # prefer a comprehensive stroke unit when the route still meets the window (score bonus, minutes)
    preferred_capabilities: {stroke_unit: 30}
  - id: major_trauma
    label: Major trauma / severe bleeding
    window_min: 60
    window_from: onset
    window_label: "to surgery (golden hour)"
    time_critical: true
    required_capabilities: [surgery, blood_bank]
    interim:
      label: Damage-control surgery
      capabilities: [surgery]
      window_min: 60
      stabilise_min: 45
      allow_origin: false
  - id: pph
    label: Postpartum haemorrhage
    window_min: 30
    window_from: onset
    window_label: "to obstetric surgery / blood"
    time_critical: true
    required_capabilities: [obstetric_surgery, blood_bank]
    interim:
      label: Blood transfusion
      capabilities: [blood_bank]
      window_min: 60
      stabilise_min: 30
      allow_origin: false
  - id: sepsis
    label: Sepsis
    window_min: 60
    window_from: onset
    window_label: "to IV antibiotics"
    time_critical: true
    required_capabilities: [iv_antibiotics]
    high_severity_capabilities: [icu]
    interim:
      label: Start IV antibiotics
      capabilities: [iv_antibiotics]
      window_min: 60
      stabilise_min: 30
      allow_origin: true
  - id: respiratory_failure
    label: Severe breathing difficulty
    window_min: 60
    window_from: onset
    window_label: "to ventilatory support"
    time_critical: true
    required_capabilities: [icu]
    interim:
      label: Stabilise (oxygen / airway)
      capabilities: [icu]
      window_min: 60
      stabilise_min: 30
      allow_origin: false
  - id: appendicitis
    label: Suspected appendicitis
    window_min: 1440
    window_from: onset
    window_label: "to surgery"
    time_critical: false
    required_capabilities: [surgery]
  - id: other
    label: Undifferentiated
    window_min: null
    window_from: onset
    window_label: ""
    time_critical: false
    required_capabilities: [general]
    high_severity_capabilities: [icu]

time_critical_weight: 1.5        # applied when window ≤ 120 min
time_critical_weight_max_window: 120
critical_red_flag_probability: 0.4
